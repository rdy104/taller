<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Taller Mecánico{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; }
        header { background: #2b2d42; padding: 14px 24px; }
        header a { color: #fff; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .tarjeta { background: #fff; border-radius: 8px; padding: 16px;
                   margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e5e8; }
        th { background: #e9ebef; }
        .estado { border-radius: 12px; padding: 2px 10px; font-size: 13px; }
        .e-recibido { background: #e3e5e8; }
        .e-en-reparacion { background: #ffe8b3; }
        .e-listo { background: #c9f0d6; }
        .e-entregado { background: #cfe2ff; }
        .filtros a { margin-right: 12px; }
        footer { text-align: center; color: #777; padding: 24px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'ordenes' %}">Taller Mecánico — Órdenes</a>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
    <footer>Demostración de Programación II — TECBA</footer>
</body>
</html>
